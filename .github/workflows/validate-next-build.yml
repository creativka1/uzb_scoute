name: Validate Next Build

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "lib/**"
      - "hooks/**"
      - "scripts/**"
      - "tests/**"
      - "data/**"
      - "components/**"
      - "types/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "playwright.config.ts"
      - ".github/workflows/validate-next-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-next-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: TypeScript and lint
        run: npm run lint

      - name: Data and API regression tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium

      - name: Desktop and mobile MVP workflow
        run: npm run test:e2e
