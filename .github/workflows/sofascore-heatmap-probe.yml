name: Sync SofaScore Heatmaps

on:
  push:
    branches: [main]
    paths:
      - "scripts/sync_sofascore_heatmaps.py"
      - ".github/workflows/sofascore-heatmap-probe.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

concurrency:
  group: sync-sofascore-heatmaps
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HTTP client
        run: pip install curl_cffi

      - name: Cache a small heatmap batch
        run: python scripts/sync_sofascore_heatmaps.py --max-requests 12 --delay 8

      - name: Commit source heatmaps
        run: |
          if [ -z "$(git status --porcelain -- data/cache/heatmaps data/audits/heatmap_sync_status.json)" ]; then
            echo "No new heatmaps."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache/heatmaps data/audits/heatmap_sync_status.json
          git commit -m "data: cache SofaScore player heatmaps"
          git pull --rebase origin main
          git push
