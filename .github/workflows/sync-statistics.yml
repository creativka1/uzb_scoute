name: Sync verified match statistics
on:
  push:
    branches:
      - main
    paths:
      - data/.sync-2026-request
  workflow_dispatch:
    inputs:
      max_requests:
        description: Maximum API-Football requests for this run (free plan safe default)
        default: '95'
        required: true
      season_year:
        description: Season year to sync
        default: '2026'
        required: true
      league:
        description: League code (UZB or KAZ)
        default: 'UZB'
        required: true
permissions:
  contents: write
concurrency:
  group: source-data-updates
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install curl_cffi
      - name: Validate API-Football adapter
        run: python -m py_compile app/api/players/scripts/sync_api_football.py

      - name: Download player match statistics from API-Football
        id: provider_sync
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          MAX_REQUESTS: ${{ github.event_name == 'push' && '95' || inputs.max_requests }}
          SEASON_YEAR: ${{ github.event_name == 'push' && '2026' || inputs.season_year }}
          LEAGUE: ${{ github.event_name == 'push' && 'UZB' || inputs.league }}
        run: |
          python app/api/players/scripts/sync_api_football.py \
            --max-requests "$MAX_REQUESTS" \
            --season-year "$SEASON_YEAR" \
            --league "$LEAGUE"

      - name: Sync official 2026 match centre
        env:
          LEAGUE: ${{ github.event_name == 'push' && 'UZB' || inputs.league }}
        run: |
          args=()
          if [ -n "$LEAGUE" ]; then args+=(--league "$LEAGUE"); fi
          python scripts/sync_official_2026_matches.py "${args[@]}"

      - name: Link cached 2026 lineups to official matches
        if: always()
        run: python scripts/link_2026_lineups.py

      - name: Rebuild evidence and partial-cache coverage
        if: always()
        run: |
          python scripts/data_integrity.py
          python scripts/build_detailed_positions.py

      - name: Persist source checkpoints and status
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: checkpoint API-Football source data"
          git push
