name: Sync verified match statistics
on:
  push:
    branches:
      - main
    paths:
      - data/.sync-2026-request
  workflow_dispatch:
    inputs:
      season_year:
        description: Season to sync
        type: choice
        options: ['2025', '2026']
        default: '2026'
        required: true
      provider:
        description: Existing SofaScore connection
        type: choice
        options: [public, rapidapi]
        default: public
        required: true
permissions:
  contents: write
concurrency:
  group: source-data-updates
  cancel-in-progress: true

env:
  SYNC_SEASON_YEAR: ${{ inputs.season_year || '2026' }}
  SYNC_PROVIDER: ${{ inputs.provider || 'public' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SofaScore sync dependency
        run: pip install curl_cffi

      - name: Validate existing SofaScore adapters
        run: python -m py_compile app/api/players/scripts/sync_sofascore_public.py app/api/players/scripts/sync_sofascore.py

      - name: Sync selected UZB season
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          adapter=app/api/players/scripts/sync_sofascore_public.py
          if [ "$SYNC_PROVIDER" = rapidapi ]; then
            adapter=app/api/players/scripts/sync_sofascore.py
          fi
          python "$adapter" \
            --league UZB \
            --season-year "$SYNC_SEASON_YEAR" \
            --max-requests 600

      - name: Link cached 2026 lineups to official matches
        if: always() && env.SYNC_SEASON_YEAR == '2026'
        run: python scripts/link_2026_lineups.py

      - name: Rebuild verified datasets
        if: always()
        run: |
          python scripts/data_integrity.py
          python scripts/build_detailed_positions.py

      - name: Persist SofaScore sync data and status
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: sync SofaScore UZB $SYNC_SEASON_YEAR statistics ($SYNC_PROVIDER)"
          git push
