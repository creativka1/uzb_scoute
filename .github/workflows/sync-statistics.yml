name: Sync verified match statistics
on:
  push:
    branches:
      - main
    paths:
      - data/.sync-2026-request
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: source-data-updates
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PFL sync dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Sync official PFL 2026 player statistics
        run: python scripts/sync_pfl_2026_player_stats.py

      - name: Rebuild existing verified datasets
        run: |
          python scripts/data_integrity.py
          python scripts/build_detailed_positions.py

      - name: Persist official 2026 data
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: sync official PFL 2026 player statistics"
          git push
