name: Sync verified match statistics
on:
  push:
    branches:
      - main
    paths:
      - data/.sync-2026-request
  workflow_dispatch:
    inputs:
      max_requests:
        description: Maximum HTTP requests including retries (uses RapidAPI quota)
        default: '1500'
        required: true
      season_year:
        description: Optional season year to sync, e.g. 2026
        default: ''
        required: false
      league:
        description: Optional league code (UZB or KAZ); blank means both
        default: ''
        required: false
permissions:
  contents: write
concurrency:
  group: source-data-updates
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install curl_cffi
      - name: Download selected competitions through provider
        id: provider_sync
        continue-on-error: true
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          MAX_REQUESTS: ${{ github.event_name == 'push' && '1500' || inputs.max_requests }}
          SEASON_YEAR: ${{ github.event_name == 'push' && '2026' || inputs.season_year }}
          LEAGUE: ${{ inputs.league }}
        run: |
          args=(--max-requests "$MAX_REQUESTS")
          if [ -n "$SEASON_YEAR" ]; then args+=(--season-year "$SEASON_YEAR"); fi
          if [ -n "$LEAGUE" ]; then args+=(--league "$LEAGUE"); fi
          python app/api/players/scripts/sync_sofascore.py "${args[@]}"

      - name: Sync official 2026 match centre
        env:
          LEAGUE: ${{ inputs.league }}
        run: |
          args=()
          if [ -n "$LEAGUE" ]; then args+=(--league "$LEAGUE"); fi
          python scripts/sync_official_2026_matches.py "${args[@]}"

      - name: Link cached 2026 lineups to official matches
        if: always()
        run: python scripts/link_2026_lineups.py

      - name: Rebuild evidence and partial-cache coverage
        if: always()
        run: |
          python scripts/data_integrity.py
          python scripts/build_detailed_positions.py

      - name: Sync and validate FootyStats 2026
        if: always()
        env:
          FOOTYSTATS_API_KEY: ${{ secrets.FOOTYSTATS_API_KEY }}
          FOOTYSTATS_LEAGUES: UZB,KAZ
          FOOTYSTATS_SEASON_YEAR: '2026'
        run: |
          if [ -z "$FOOTYSTATS_API_KEY" ]; then
            node -e "const fs=require('fs');fs.mkdirSync('data/audits',{recursive:true});fs.writeFileSync('data/audits/footystats_status.json',JSON.stringify({status:'not_configured',updatedAt:new Date().toISOString(),reason:'FOOTYSTATS_API_KEY secret is not configured'},null,2)+'\n')"
            exit 0
          fi
          npm run sync:footystats
          npm run audit:sources
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('data/audits/source_reconciliation.json','utf8'));fs.writeFileSync('data/audits/footystats_status.json',JSON.stringify({status:'success',updatedAt:new Date().toISOString(),leagues:Object.fromEntries(Object.entries(a.leagues||{}).map(([k,v])=>[k,{matched:v.matched,aligned:v.aligned,conflicts:v.conflicts,unmatched:v.unmatched,ambiguous:v.ambiguous}]))},null,2)+'\n')"

      - name: Validate season totals with FootyStats when configured
        if: always()
        env:
          FOOTYSTATS_API_KEY: ${{ secrets.FOOTYSTATS_API_KEY }}
          FOOTYSTATS_LEAGUES: UZB,KAZ
          FOOTYSTATS_SEASON_YEAR: '2026'
        run: node scripts/run_footystats_validation.mjs
      - name: Persist source checkpoints and status
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: checkpoint verified football source data"
          git push
