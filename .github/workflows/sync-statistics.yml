name: Sync verified match statistics
on:
  push:
    branches:
      - main
    paths:
      - data/.sync-2026-request
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: source-data-updates
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Probe official PFL player statistics table
        run: python scripts/probe_pfl_player_stats.py

      - name: Sync official 2026 match centre
        run: python scripts/sync_official_2026_matches.py --league UZB

      - name: Rebuild evidence
        run: |
          python scripts/data_integrity.py
          python scripts/build_detailed_positions.py

      - name: Persist source checkpoints and status
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: checkpoint official PFL 2026 data"
          git push
