name: Sync verified match statistics
on:
  workflow_dispatch:
    inputs:
      max_requests:
        description: Maximum HTTP requests including retries (uses RapidAPI quota)
        default: '1500'
        required: true
permissions:
  contents: write
concurrency:
  group: source-data-updates
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install curl_cffi
      - name: Download both competitions
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          MAX_REQUESTS: ${{ inputs.max_requests }}
        run: python app/api/players/scripts/sync_sofascore.py --max-requests "$MAX_REQUESTS"
      - name: Rebuild evidence and partial-cache coverage
        if: always()
        run: |
          python scripts/data_integrity.py
          python scripts/build_detailed_positions.py
      - name: Persist source checkpoints and status
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: checkpoint verified SofaScore source data"
          git push
