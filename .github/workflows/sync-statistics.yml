name: Sync verified match statistics
on:
  push:
    branches:
      - main
    paths:
      - data/.sync-2026-request
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: source-data-updates
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser probe dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Probe official PFL player statistics table
        run: python scripts/probe_pfl_player_stats.py

      - name: Persist PFL statistics probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/pfl_stats_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: inspect official PFL statistics table"
          git push
