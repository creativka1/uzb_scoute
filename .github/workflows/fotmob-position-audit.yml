name: FotMob Position Coverage Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit_fotmob_positions.py"
      - ".github/workflows/fotmob-position-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit 30 recent Superliga matches
        run: python scripts/audit_fotmob_positions.py --matches 30

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: fotmob-position-coverage
          path: data/audits/fotmob_position_coverage.json
          if-no-files-found: error
