name: Build Detailed Positions

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_detailed_positions.py"
      - "data/cache/lineups/*.json"
      - "data/cache/heatmaps/*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-detailed-positions
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build detailed position evidence
        run: python scripts/build_detailed_positions.py

      - name: Commit generated position data
        run: |
          if git diff --quiet -- data/detailed_positions.json; then
            echo "No detailed position changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/detailed_positions.json
          git commit -m "data: refresh detailed player positions"
          git push
